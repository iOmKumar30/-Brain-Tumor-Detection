services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      BRATS_CONFIG: configs/default.yaml
      BRATS_CHECKPOINT: checkpoints/best.pt
      BRATS_DEVICE: cpu
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./outputs:/app/outputs

  webapp:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./webapp:/app
    depends_on:
      - api

